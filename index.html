<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporarily Unavailable | Makasana Consultancy</title>
  <style>
    :root {
      --navy: #0a192f;
      --red: #e30613;
      --muted: #64748b;
      --bg: #f5f7fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--navy);
      background:
        linear-gradient(252deg, #c5d0e0 0%, rgba(10, 25, 47, 0) 100%),
        var(--bg);
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border: 1px solid #d8dee8;
      border-radius: 14px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(10, 25, 47, 0.08);
    }
    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.25;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Service notice</div>
    <h1>We'll be right back</h1>
    <p>
      Makasana Consultancy is temporarily unavailable while maintenance is in progress.
      Please try again shortly.
    </p>
  </main>
</body>
</html>
